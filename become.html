<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/become.css">
    <title>Become Model | THE CAST</title>
</head>
<body>
     <header class="header">
         <a href="index.html" class="header-logo">THE CAST</a>
            <div class="menu">
                <a href="index.html">HOME</a>
                <a href="women.html">MODELS</a>
                <a href="become.html">BECOME MODEL</a>
                <a href="contact.html">CONTACT US</a>
            </div>
    </header>
    <div class="divider"></div>
    <section id="become">
                <h1>JOIN US!</h1>
                <p class="for-form">We are always looking for new talent. No prior experience is required — just passion, <br> commitment, and a unique look.</p>

                <form class="join-form">

            
            <div class="form-columns">
           
                <div class="form-column">
                <label class="field">
                    <span class="field-label">First name</span>
                    <input type="text" name="firstName">
                </label>

                <label class="field">
                    <span class="field-label">Last name</span>
                    <input type="text" name="lastName">
                </label>

                <label class="field">
                    <span class="field-label">Date of birth</span>
                    <input type="date" name="dob">
                </label>

                <label class="field">
                    <span class="field-label">Location</span>
                    <input type="text" name="location">
                </label>

                <label class="field">
                    <span class="field-label">Phone</span>
                    <input type="tel" name="phone">
                </label>

                <label class="field">
                    <span class="field-label">E-mail</span>
                    <input type="email" name="email">
                </label>

                <label class="field">
                    <span class="field-label">Instagram</span>
                    <input type="text" name="instagram">
                </label>
                </div>

            
                <div class="form-column">
                <label class="field">
                    <span class="field-label">Height</span>
                    <input type="text" name="height">
                </label>

                <label class="field">
                    <span class="field-label">Chest</span>
                    <input type="text" name="chest">
                </label>

                <label class="field">
                    <span class="field-label">Waist</span>
                    <input type="text" name="waist">
                </label>

                <label class="field">
                    <span class="field-label">Hips</span>
                    <input type="text" name="hips">
                </label>

                <label class="field">
                    <span class="field-label">Shoe size</span>
                    <input type="text" name="shoeSize">
                </label>

                <label class="field">
                    <span class="field-label">Tattoos</span>
                    <input type="text" name="tattoos">
                </label>

                <label class="field">
                    <span class="field-label">Scars / piercing</span>
                    <input type="text" name="scars">
                </label>
                </div>
            </div>

            <div class="photo-row">
                <label class="photo-upload">
                <input type="file" name="photo1" accept="image/*">
                <span>CLOSE-UP</span>
                </label>

                <label class="photo-upload">
                <input type="file" name="photo2" accept="image/*">
                <span>PROFILE</span>
                </label>

                <label class="photo-upload">
                <input type="file" name="photo3" accept="image/*">
                <span>FULL LENTH</span>
                </label>
            </div>

        
            <div class="checkboxes">
                <label class="checkbox">
                <input type="checkbox" name="agree1">
                <span>I confirm that I am over 18 or have permission from a parent or legal guardian</span>
                </label>

                <label class="checkbox">
                <input type="checkbox" name="agree2">
                <span>I have read and understood the <a href="#" class="policy">Privacy Policy</a></span>
                </label>
            </div>

        
            <button type="submit" class="join-btn">JOIN THE CAST</button>

        </form>

    </section>
    
    
       <div class="divider"></div>
    <footer>
        <div class="footer-container">
           <div class="footer-menu">
                <a href="contact.html">CONTACT US</a>
                <a href="privacy.html">PRIVACY POLICY</a>
                <a href="#" id="open-cookie">COOKIE SETTINGS</a>
            </div>
            <p class="footer-copy">All rights reserved. Copyright &copy; 2026</p>
        </div>

    </footer>
    
    <script src="js/cookie.js"></script>
</body>
</html>
